name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: go test ./...

      - name: Smoke verify
        run: make verify
